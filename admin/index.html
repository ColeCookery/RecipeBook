---
layout: default
title: Cole Cookery Recipes
permalink: /
---
<h2>Categories</h2>

<div class="groups">
    <div id="cats">
        {% for category in site.data.categories %}
        <div class="category-tile">
            <a href="{{ category.link | relative_url }}">
                <img class="cat-icon" src="{{ category.image | relative_url }}" alt="{{ category.name }}">
                <span>{{ category.name }}</span>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
